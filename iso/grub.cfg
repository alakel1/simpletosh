set timeout=5
set default=0
insmod all_video
insmod gfxterm
search --no-floppy --set=root --file /live/oclauncher.id

menuentry "OpenCore Launcher @VERSION@" {
    linux /live/vmlinuz boot=live components quiet splash noeject
    initrd /live/initrd.img
}
menuentry "OpenCore Launcher (safe graphics)" {
    linux /live/vmlinuz boot=live components nomodeset noeject oclauncher.safegfx
    initrd /live/initrd.img
}
menuentry "OpenCore Launcher (load into RAM, frees the USB stick)" {
    linux /live/vmlinuz boot=live components quiet toram
    initrd /live/initrd.img
}
menuentry "UEFI firmware settings" --id uefi-firmware {
    fwsetup
}
